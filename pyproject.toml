[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratbox"
dynamic = ["version"]
readme = "README.md"
description = "Strategy Box core library with business domains and neutral infrastructure."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
http = ["requests>=2.32", "urllib3>=2.2"]
dataframe = ["numpy>=1.24", "pandas>=2.0"]
excel = ["openpyxl>=3.1", "XlsxWriter>=3.2"]
excel-legacy = ["xlrd>=2.0.2", "xlwt>=1.3", "olefile>=0.47"]
excel-binary = ["pyxlsb>=1.0.10"]
dbf = ["dbfread>=2.0.7"]
dbf-write = ["dbf>=0.99"]
rar = ["rarfile>=4.2"]
pdf = ["pypdf>=4.0"]
documents = ["python-docx>=1.1", "python-pptx>=1.0", "Pillow>=10"]
sors-restoration = ["stratbox[dataframe,excel]", "highspy>=1.11,<2"]
test = [
  "pytest>=8.0",
  "scipy>=1.10",
  "stratbox[http,dataframe,excel,excel-legacy,excel-binary,dbf,rar,sors-restoration]",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "stratbox.__version__"}

[tool.setuptools.package-data]
"stratbox" = ["py.typed"]
"stratbox.registries" = ["_resources/**/*"]
"stratbox.macrobanks.cbr_forms.models" = ["*.csv"]
"stratbox.macrobanks.cbr_sors_restoration.crosswalk" = ["_resources/*.csv", "_resources/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
