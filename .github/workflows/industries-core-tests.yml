name: Stratbox local acceptance parity

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/industries-core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local verification dependencies
        run: python -m pip install -e '.[test]' build
      - name: Run the same acceptance as local development
        run: python -B scripts/local_release_check.py --report release-check.json
