name: Diagnose CBR form semantics and source payload

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-cbr-frg-check.yml
      - src/stratbox/macrobanks/cbr_forms/**
      - src/stratbox/macrobanks/frg/**
      - src/stratbox/base/ioapi/**
      - tests/unit/macrobanks/cbr_forms/**
      - tests/unit/macrobanks/test_frg_operations.py

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar
          python -m pip install -q -e '.[http,dataframe,excel,dbf,rar]' pytest
      - name: Diagnose model and legacy banks
        run: |
          python - <<'PY'
          from datetime import date
          from importlib.resources import files
          import pandas as pd
          import traceback
          from stratbox.macrobanks import cbr_forms as forms
          from stratbox.macrobanks.cbr_forms.common.banks import load_legacy_banks
          from stratbox.macrobanks.cbr_forms.common.models import parse_form_model
          from stratbox.macrobanks.cbr_forms.common.formula import build_formula_long
          from stratbox.macrobanks.cbr_forms.forms.form101 import DEFAULT_SPEC
          key = forms.FormKey("101",date(2024,1,1))
          try:
              banks=load_legacy_banks()
              print("BANK_REGISTRY",len(banks),banks.columns.tolist(), banks.head(2).to_dict("records"))
              model=parse_form_model(files("stratbox.macrobanks.cbr_forms.models").joinpath("form101.csv").read_bytes(),"101")
              print("MODEL",len(model))
              frame=pd.DataFrame([("1481","45.2",10,"1")],columns=["REGN","CODE","VALUE","SIDE"])
              print("SYNTHETIC",build_formula_long([("01.01.2024",frame)],banks,model,DEFAULT_SPEC)[0].shape)
          except Exception:
              print("SYNTHETIC_FAILURE")
              traceback.print_exc()
          from stratbox.base.net import RequestsTransport
          from stratbox.base.ioapi.archive_bytes import RarArchiveReader
          import os
          if os.environ.get("TEST_LIVE_CBR","1")=="1":
              a=forms.acquire(key,transport=RequestsTransport())
              print("LIVE_ACQUIRE",a.outcome,[d.code for d in a.diagnostics])
              if a.outcome=="succeeded":
                  b=forms.parse_form(forms.ParseFormRequest(key,a.value.payload),rar_reader=RarArchiveReader())
                  print("LIVE_PARSE",b.outcome,[d.code for d in b.diagnostics])
                  if b.outcome=="succeeded":
                      try:
                          print("LIVE_BUILD",build_formula_long([("01.01.2024",b.value.rows)],banks,model,DEFAULT_SPEC)[0].shape)
                      except Exception:
                          traceback.print_exc()
          PY
      - name: Live CBR one-period end-to-end for all six forms
        run: |
          python - <<'PY'
          from datetime import date
          from stratbox.base.net import RequestsTransport
          from stratbox.base.ioapi.archive_bytes import RarArchiveReader
          from stratbox.macrobanks import cbr_forms as forms

          transport = RequestsTransport()
          rar_reader = RarArchiveReader()
          banks = (forms.BankSelection("1000", "Test Bank"),)
          for code in ("101", "102", "123", "135", "802", "805"):
              key = forms.FormKey(code, date(2024,1,1))
              downloaded = forms.acquire(key, transport=transport)
              print("LIVE6", code, "acquire", downloaded.outcome, [x.code for x in downloaded.diagnostics],flush=True)
              assert downloaded.outcome=="succeeded", code
              parsed = forms.parse_form(
                  forms.ParseFormRequest(key, downloaded.value.payload), rar_reader=rar_reader
              )
              print("LIVE6", code, "parse", parsed.outcome, [x.code for x in parsed.diagnostics],flush=True)
              assert parsed.outcome=="succeeded", code
              data = forms.build_form_data(forms.BuildFormDataRequest(
                  (parsed.value,), banks=banks,
              ))
              print("LIVE6", code, "build", data.outcome, [x.code for x in data.diagnostics],flush=True)
              assert data.outcome=="succeeded", code
              views = forms.build_form_views(data.value)
              assert views.outcome=="succeeded", (code, views.diagnostics)
              rendered = forms.render_workbook(views.value)
              print("LIVE6", code, "xlsx", rendered.outcome,flush=True)
              assert rendered.outcome=="succeeded", (code, rendered.diagnostics)
          PY
      - name: Regression tests
        run: pytest -q tests/unit/macrobanks/cbr_forms tests/unit/macrobanks/test_frg_operations.py tests/unit/macrobanks/test_frg_stream_archive.py
