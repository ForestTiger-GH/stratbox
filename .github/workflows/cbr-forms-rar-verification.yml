name: Verify official CBR form RAR MIME

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cbr-forms-rar-verification.yml
      - src/stratbox/macrobanks/_cbr.py
      - src/stratbox/macrobanks/cbr_forms/**
      - tests/unit/macrobanks/cbr_forms/**

jobs:
  forms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[http,dataframe,excel,dbf,rar]' pytest
      - name: Verify imports
        run: python scripts/check_internal_imports.py
      - name: Run CBR forms regressions
        run: pytest -q tests/unit/macrobanks/cbr_forms
