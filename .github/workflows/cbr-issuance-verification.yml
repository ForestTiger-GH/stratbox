name: Verify CBR issuance 01_04_A
on:
  push:
    branches: [feat/cbr-industry-issuance-0104]
    paths:
      - .github/workflows/cbr-issuance-verification.yml
      - src/stratbox/macrobanks/cbr_industries/**
      - tests/unit/macrobanks/test_cbr_industries_0104a_issuance.py
jobs:
  issuance-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install business-core testing dependencies
        run: python -m pip install -e '.[dataframe,excel,http]' pytest
      - name: Verify imports and compile
        run: |
          python scripts/check_internal_imports.py
          python -m compileall -q src/stratbox/macrobanks/cbr_industries
      - name: Verify industry portfolio and issuance unit suites
        run: pytest -q tests/unit/macrobanks/test_cbr_industries_0104a_issuance.py tests/unit/macrobanks/test_cbr_industries_0105a_debt_corp.py
