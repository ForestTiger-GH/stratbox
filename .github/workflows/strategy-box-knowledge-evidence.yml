name: Strategy Box knowledge evidence (bounded)

on:
  push:
    paths:
      - '.github/workflows/strategy-box-knowledge-evidence.yml'
      - '_mw/epochs-001-strategy-box-development/consolidation/tools/**'
      - '_mw/epochs-001-strategy-box-development/consolidation/units/**'
      - '_mw/epochs-001-strategy-box-development/consolidation/sources/CENSUS.csv'
      - 'docs/**'
      - '_mw/epochs-001-strategy-box-development/consolidation/coverage/**'
      - '_mw/epochs-001-strategy-box-development/consolidation/STATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: "Enforce standalone Knowledge: no links to removable Research or Work"
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/migrate_knowledge_research_links.py --check
      - name: "Verify three independent core and example legacy notes"
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_core_legacy_public_notes.py
      - name: "Verify historical FRG and earlier SORS methodology source units"
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_frg_sors_legacy_notes.py
      - name: "Verify three dated SORS implementation report source meanings"
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_sors_august_reports.py
      - name: "Verify SORS acceptance and architecture historical evidence routes"
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_sors_acceptance_architecture.py
      - name: "Verify six fully read historical SORS technical originals and Science routes"
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_sors_legacy_technical_notes.py
      - name: "Verify exact link migration preserved substantive text"
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_knowledge_link_migration_fidelity.py
      - name: "Produce deterministic no-Research portable Knowledge-only ZIP"
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/package_standalone_knowledge.py
      - name: "Publish independent-reader Knowledge-only bundle with file manifest"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy-box-knowledge-standalone
          path: |
            dist/strategy-box-knowledge-standalone.zip
            dist/strategy-box-knowledge-standalone.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Build separate answer-free 22-case independent reviewer handoff packet
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/build_independent_reviewer_kit.py
      - name: Upload source-hidden questions separately from the Knowledge publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy-box-independent-reader-questions
          path: |
            dist/strategy-box-independent-reader-questions.zip
            dist/strategy-box-independent-reader-questions.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Characterize local SQLite Run+dispatch transaction crash windows (not deployed host)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_native_sqlite_outbox_crash_characterization.py > native_sqlite_dispatch_audit.json
      - name: Characterize real POSIX path, staging and create-only races at exact Git revision (Linux only)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_native_local_storage_race_characterization.py > native_storage_fault_audit.json
      - name: Evaluate exact Knowledge program gate evidence without false global completion
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/assess_knowledge_work_program_gates.py
      - name: Parse documentation-only LCD Python code skeletons (syntax, not runtime readiness)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_lcd_python_skeletons.py
      - name: Execute selected LCD candidate fragments against synthetic ports (not production)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_lcd_candidate_behavior.py
      - name: "Exercise docs-only archive-amputation navigation in isolation"
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_docs_only_archive_amputation.py
      - name: Validate all maintained Knowledge publication links and host owner routing
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/audit_publication_routes.py
      - name: Fetch exact public Windows source for bounded execution characterization
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ForestTiger-GH/stratbox-windows
          ref: 959e9c4ce1441124af5111c1e025041714e04d3b
          path: windows-pinned
          persist-credentials: false
      - name: Execute pinned Windows scenario and local-log behavior with synthetic inputs
        run: PYTHONPATH=windows-pinned/src python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_pinned_windows_runtime_behaviors.py
      - name: Characterize pinned Windows settings load, coercion and write-fault effects
        run: PYTHONPATH=windows-pinned/src python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_pinned_windows_settings_config.py
      - name: Characterize pinned core CBR collector accounting with offline fakes
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_cbr_collector_observed_accounting.py
      - name: Characterize FRG cleanup replacement and archive fault safety with offline fakes
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_frg_cleanup_observed_faults.py
      - name: Characterize local FileStore root, missingness and write safety in temp directories
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_local_filestore_observed_safety.py
      - name: Verify fifteen self-contained cross-surface fault family owner links
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_cross_surface_fault_case_links.py
      - name: Verify historical Windows source survey early material routes
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_windows_0020_historical_introduction.py
      - name: Verify all eighteen input-vintage Research 09 counterexamples
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_source_vintage_0562_cases.py
      - name: Verify all twenty-eight observability fault-case source intentions
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_observability_0561_negative_cases.py
      - name: Verify twenty original ontology Topic-01 negative vectors and two identity experiments
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_ontology_0554_twenty_probes.py
      - name: Verify twenty original state-recovery Topic-03 fault proposals
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_recovery_0556_twenty_faults.py
      - name: Verify twenty-six frozen execution Topic-02 failure-vector intentions
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_execution_0555_failure_vectors.py
      - name: Verify original 0018 eighteen candidate HTTP routes without treating them as installed
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_background_0018_http_example_routes.py
      - name: Verify original background-study 13 defaults, 7 questions, and 7 staged alternatives
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_background_0018_defaults_and_staged_alternatives.py
      - name: Verify five contract and twelve client Topic-07 source acceptance proposals
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_crossplatform_0560_acceptance_vectors.py
      - name: Verify all twenty-two original integration-owner contract acceptance vectors
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_integration_0563_acceptance_vectors.py
      - name: Verify twenty-five dated machine-interface conformance intentions
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_machine_0559_acceptance_vectors.py
      - name: Verify full thirty source-spanned security negative-case proposals
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_security_0558_negative_cases.py
      - name: Verify bounded source item transfers and local Science links
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_exact_material_transfers.py
      - name: Verify historical launcher original 0014 whole producer routes (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_historical_0014_full_producer.py
      - name: Verify whole historical refactor 0016 source-section producer review (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_historical_0016_whole_producer.py
      - name: Verify historical domain profiles 0016 original source routes (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_historical_0016_domain_profiles.py
      - name: Verify seven original business refactor 0016 application seams (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_historical_0016_application_seams.py
      - name: Verify historical business refactor 0016 source-to-Science candidate routes
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_historical_business_0016_routes.py
      - name: Verify 0015 bounded public-safe original domain residues (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_historical_0015_public_safe_residue.py
      - name: Verify original May banking domain patch 0015 public Science routes (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_historical_patch_0015_routes.py
      - name: Verify original historical application note 0014 Science routes (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_historical_application_0014_routes.py
      - name: Verify whole historical UX original 0013 producer section routes (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_historical_0013_full_producer.py
      - name: Verify historical UI residual source-to-Science routes (structural only)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_ux_0013_residual_routes.py
      - name: Verify seven original Automation client-flow source routes (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_automation_0041_flow_routes.py
      - name: Verify original Automation 0041 ontology and authority distinctions (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_automation_0041_ontology_routes.py
      - name: Verify automation protocol source-to-Science routes (bounded only)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_automation_0041_protocol_routes.py
      - name: Verify direct pinned three-operation Windows registry and composed Scenario
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_pinned_windows_operation_catalog.py
      - name: Verify pinned Windows entrypoint and catalog source routes (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_windows_0020_entry_capability_routes.py
      - name: Verify pinned Windows Research original 0020 source-to-Science routes (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_windows_0020_source_science_routes.py
      - name: Verify frozen Topic 03 recovery source-to-Science routes (structural only)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_state_0556_recovery_routes.py
      - name: Check unique host LDD HC vector IDs (structural)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_host_ldd_case_ids.py
      - name: Verify Topic 04 Artifact original source-to-Science candidate routes
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_artifacts_0557_source_routes.py
      - name: Verify twenty exact Topic-04 Artifact A acceptance cases and five backend profiles
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/verify_artifact_0557_twenty_acceptance_cases.py
      - name: Route non-Research source roles without falsely disposing material
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/audit_nonresearch_source_roles.py
      - name: Audit research source coverage and distinguish evidence classes
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/audit_research_material_coverage.py > research_coverage_audit.json
      - name: Verify structural audit parser and boundary self-tests
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/test_audit_research_span_routes.py
      - name: Audit span-level Research routing without semantic certification
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/audit_research_span_routes.py --top 8 > research_span_audit.json
      - name: Summarize exact uncovered original Research geometry without claiming material loss
        run: |
          python3 _mw/epochs-001-strategy-box-development/consolidation/tools/audit_research_span_routes.py --top 0 --unspanned 53 > original_span_gap_triage.json
          python3 -c 'import json; a=json.load(open("original_span_gap_triage.json")); x=a.get("completely_unspanned_candidate_geometry",[]); print("UNSPANNED RESEARCH ORIGINALS:",len(x)); print("TOP GAPS:",[(z["source_id"],z["unspanned_nonblank"],[b["span"] for b in z["blocks"][:6]]) for z in x[:22]])'
      - name: Prepare exact-frozen original 0020/0046 unspanned line-block reviewer triage (not meaning certification)
        run: python3 _mw/epochs-001-strategy-box-development/consolidation/tools/triage_unspanned_0020_0046_blocks.py
      - name: Show structural source-span audit headline
        if: always()
        run: |
          if [ -f research_span_audit.json ]; then
            python3 -c 'import json; r=json.load(open("research_span_audit.json")); print({k:v for k,v in r.items() if k not in ("sources_lowest_structural_coverage", "structural_issues")}); print("LOWEST:", [(x["source_id"],x["coverage_ratio_not_semantic_preservation"]) for x in r.get("sources_lowest_structural_coverage", [])]); print("ISSUES:", r.get("structural_issues", []))'
          fi
      - name: Show research coverage audit headline
        if: always()
        run: |
          if [ -f research_coverage_audit.json ]; then
            python3 -c 'import json; j=json.load(open("research_coverage_audit.json")); print({k:v for k,v in j.items() if k not in ("source_detail",)})'
          fi
      - name: Publish bounded source accounting evidence for separate reviewers
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy-box-research-audit-bounded
          path: |
            research_coverage_audit.json
            research_span_audit.json
            original_span_gap_triage.json
            dist/research-original-0020-0046-unspanned-triage.json
            dist/strategy-box-work-program-gates.json
            native_sqlite_dispatch_audit.json
            native_storage_fault_audit.json
          if-no-files-found: error
          retention-days: 14
