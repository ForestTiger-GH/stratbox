{
  "owner_id": "rosstat",
  "definition": {
    "operation_id": "rosstat.integration.integrate",
    "request_type": "stratbox.domains.rosstat.operations.contracts:IntegrateRequest",
    "value_type": "stratbox.domains.rosstat.integration.datasets:RosstatDataset",
    "limits": {
      "seconds": 600,
      "input_bytes": 268435456,
      "decoded_bytes": 536870912,
      "output_bytes": 536870912,
      "objects": 2000000,
      "cells": 20000000,
      "temporary_bytes": 536870912
    },
    "processing": {
      "stages": [
        "integrate"
      ],
      "inputs": [
        {
          "name": "flakes",
          "contract": {
            "schema_id": "rosstat.source_flake",
            "role": "extracts"
          },
          "outcomes": [
            "partial",
            "succeeded"
          ],
          "collection": true
        }
      ],
      "outputs": [
        {
          "name": "dataset",
          "contract": {
            "schema_id": "rosstat.integrated_dataset",
            "role": "integrated"
          },
          "path": "",
          "source_policy": "primary_source_required"
        }
      ],
      "parameters": [
        "dataset_id",
        "release_id"
      ],
      "summary": "Integrate explicitly resolved source-flake observations; reject collisions and unresolved semantics.",
      "required_parameters": [
        "dataset_id",
        "release_id"
      ]
    },
    "method_id": "rosstat-integration-integrate",
    "request_fields": {
      "dataset_id": "parameter",
      "flakes": "input",
      "release_id": "parameter"
    }
  },
  "implementation": {
    "handler_ref": "stratbox.domains.rosstat.operations.handlers:integrate"
  },
  "schema": "stratbox.operation"
}
