          "version": 1,
          "role": "extracts"
        },
        "schema_ref": "stratbox.domains.rosstat.tables.snapshots:_METADATA",
        "uses": [
          {
            "source": "series_id",
            "issue": "issue_id",
            "material": {
              "sha256": "source_sha256",
              "size": "source_size"
            },
            "semantic_profile_edition": {
              "join": [
                "profile_id",
                "profile_version"
              ],
              "separator": ":"
            },
            "asset": "asset_id"
          }
        ]
      }
    ]
