{
  "owner_id": "rosstat",
  "stages": [
    {
      "stage": "preserve",
      "state": "delegated",
      "reason": "rosstat.portable_storage",
      "operations": [
        {
          "operation_id": "source.save_original"
        },
        {
          "operation_id": "source.read_original"
        },
        {
          "operation_id": "dataset.write_snapshot"
        },
        {
          "operation_id": "dataset.read_snapshot"
        },
        {
          "operation_id": "material.save_artifact"
        }
      ],
      "binding": "Preserve original SourcePayload bytes or complete physical/source-flake/dataset/view snapshots using the caller-selected neutral storage adapter."
    },
    {
      "stage": "ingest",
      "state": "delegated",
      "reason": "rosstat.typed_dataset_storage",
      "operations": [
        {
          "operation_id": "dataset.write_snapshot"
        }
      ],
      "binding": "Bind rosstat.integration.dataset_snapshot or a selected source-flake snapshot to the neutral typed dataset writer."
    },
    {
      "stage": "publish",
      "state": "inapplicable",
      "reason": "rosstat.consumer_publication_policy",
      "operations": [],
      "binding": null
    }
  ],
  "value_contexts": {
    "types": {
      "stratbox.domains.rosstat.integration.datasets.DatasetSource": {
        "uses": [
          {
            "source": "series_id",
            "issue": "issue_id",
            "layout_edition": "profile_version",
            "asset": "asset_id",
            "material": "source_identity"
          }
        ]
      },
      "stratbox.domains.rosstat.operations.contracts.GrowthRequest": {
        "traverse": true
      },
      "stratbox.domains.rosstat.operations.contracts.IntegrateRequest": {
        "traverse": true
      },
      "stratbox.domains.rosstat.operations.contracts.PhysicalRequest": {
        "uses": [
          {
            "source": "series_id",
            "issue": "issue_id",
            "asset": "asset_id"
          }
        ]
      },
      "stratbox.domains.rosstat.publications.contracts.DiscoverRosstatRequest": {
        "uses": [
          {
            "source": "series_id"
          }
        ]
      },
      "stratbox.domains.rosstat.publications.contracts.DiscoveredAsset": {
        "uses": [
          {
            "layout_edition": "profile_version",
            "material": "index_identity"
          }
        ],
        "traverse": true
      },
      "stratbox.domains.rosstat.publications.contracts.DiscoveryAssessment": {
        "uses": [
          {
            "layout_edition": "profile_version"
          }
        ],
        "traverse": true
      },
      "stratbox.domains.rosstat.publications.contracts.IndexScope": {
        "uses": [
          {
            "source": "series_id"
          }
        ]
      },
      "stratbox.domains.rosstat.publications.contracts.IssueKey": {
        "uses": [
          {
            "source": "series_id",
            "issue": "issue_id"
          }
        ]
      },
      "stratbox.domains.rosstat.publications.contracts.RosstatPublicationIndex": {
        "uses": [
          {
            "source": "series_id",
            "layout_edition": "profile_version",
            "material": "index_identity"
          }
        ]
      },
      "stratbox.domains.rosstat.publications.contracts.RosstatSourceSpec": {
        "uses": [
          {
            "source": "series_id"
          }
        ]
      },
      "stratbox.domains.rosstat.publications.discovery.approval.ReviewedIndexScope": {
        "uses": [
          {
            "source": "series_id",
            "layout_edition": "profile_version",
            "material": "index_identity"
          }
        ]
      },
      "stratbox.domains.rosstat.publications.discovery.families.rules.FamilyRule": {
        "uses": [
          {
            "layout_edition": "profile_version"
          }
