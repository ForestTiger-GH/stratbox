      "stratbox.domains.rosstat.tables.contracts.RosstatSourceFlake": {
        "uses": [
          {
            "source": "series_id",
            "issue": "issue_id",
            "asset": "asset_id",
            "material": "source_identity",
            "semantic_profile_edition": {
              "join": [
